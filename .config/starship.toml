palette = "noctalia"
add_newline = true


format = """
[](bold white)  $directory$git_branch$git_status$fill
$character
"""


# ==========================
# Directory
# ==========================

[directory]
style = "bold cyan"
format = "[󰋜 $path]($style) "
home_symbol = "~"
truncation_length = 4
truncate_to_repo = false


# ==========================
# Git branch
# ==========================

[git_branch]
symbol = " "
style = "magenta"
format = "[$symbol$branch]($style)"


# ==========================
# Git status
# ==========================

[git_status]
style = "yellow"
format = " [$all_status$ahead_behind]($style)"

conflicted = "⚔ "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "≡ "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count}"


# ==========================
# Dots separator
# ==========================

[fill]
symbol = "·"
style = "bright-black"


# ==========================
# Prompt
# ==========================

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

