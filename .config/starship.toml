palette = "noctalia"
format = """
[](fg:blue)\
$username\
[](fg:blue bg:cyan)\
$directory\
[](fg:cyan bg:purple)\
$git_branch\
$git_status\
[](fg:purple)\
$cmd_duration\
$line_break\
$character
"""

[username]
show_always = true
style_user = "bg:blue fg:black bold"
format = "[ $user ]($style)"

[directory]
style = "bg:cyan fg:black bold"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "󰘬 "
style = "bg:purple fg:black bold"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:purple fg:black"
format = "[$all_status$ahead_behind]($style)"

[cmd_duration]
min_time = 1000
style = "fg:white"
format = " [󱫌 $duration]($style)"

[character]
success_symbol = "[❯](bold fg:blue)"
error_symbol = "[❯](bold fg:red)"

