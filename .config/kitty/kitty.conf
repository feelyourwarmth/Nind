# ==========================
# Font
# ==========================

font_family JetBrainsMono Nerd Font Mono
font_size 10.7


# ==========================
# Keybinds
# ==========================

map ctrl+equal change_font_size all +2
map ctrl+minus change_font_size all -2

map ctrl+left previous_tab
map ctrl+right next_tab
map ctrl+t new_tab
map ctrl+w close_tab


# ==========================
# Colors
# ==========================

background #00111E
foreground #CBE0F0

cursor #47FF9C
cursor_text_color #011423

selection_background #033259
selection_foreground #CBE0F0


# ==========================
# Palette
# ==========================

color0  #214969
color1  #E52E2E
color2  #44FFB1
color3  #FFE073
color4  #0FC5ED
color5  #A277FF
color6  #24EAF7
color7  #24EAF7

color8  #214969
color9  #E52E2E
color10 #44FFB1
color11 #FFE073
color12 #A277FF
color13 #A277FF
color14 #24EAF7
color15 #24EAF7


# ==========================
# Cursor
# ==========================

cursor_shape beam
cursor_trail 1
cursor_blink_interval 0


# ==========================
# Window
# ==========================

window_margin_width 11.75
confirm_os_window_close 0


# ==========================
# Shell integration
# ==========================

shell_integration enabled


# ==========================
# Performance
# ==========================

scrollback_lines 10000

enable_audio_bell no


# ==========================
# Tabs (opcional)
# ==========================

tab_bar_style powerline
tab_powerline_style slanted
include themes/noctalia.conf
